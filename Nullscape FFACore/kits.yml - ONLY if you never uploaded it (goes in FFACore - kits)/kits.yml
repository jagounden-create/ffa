# ============================================================================
#  FFACore - kits
#
#  The easy way to build a kit:
#
#      1. Give yourself exactly the loadout you want, armour and offhand too.
#      2. /kit create <id>
#
#  That captures your whole inventory - slot positions, enchantments past the
#  vanilla cap, custom names, trims, every data component - and writes it here
#  as a snapshot. Re-running /kit create on an existing kit replaces only the
#  snapshot, so a cooldown or permission you have already tuned survives.
#
#  The other way is to describe the contents by hand under 'items', in the same
#  shape used everywhere else in this plugin. Use that when the kit should
#  follow config edits rather than needing to be re-captured.
#
#  A snapshot wins where a kit has both, because a snapshot is only ever there
#  because someone deliberately took it.
#
#  Per-kit keys:
#    display          the tile on the kit menu. display.lore is the kit's own
#                     description, shown above "Left-click to claim." - staff
#                     can also change it in game: /kit -> edit book -> the kit
#                     -> Description, then type it in chat
#    permission       who may see and claim it
#    slot             fixed menu slot, or omit to auto-place
#    cooldown         30s, 5m, 2h, 1d - omit or 0 for no cooldown
#    one-time         claimable once, ever
#    cost / currency  charged per claim
#    clear-inventory  empty the player's inventory first
#    effects          potion effects on claim
#    commands         console commands, with %player% and %kit%
#
#  Permissions: ffacore.kit.nocooldown.<id> skips one kit's cooldown,
#  ffacore.kit.nocooldown skips all of them.
# ============================================================================

config-version: 1

# Refuse to hand out a kit while PvPManager has the player tagged. Off makes
# kits a mid-fight resupply, which is a real design choice - just a different
# game from the one this defaults to.
block-in-combat: true

# Clear a player's kit cooldowns when they die, so a fresh life means a fresh
# loadout. Without this, dying ten seconds into a fifteen-minute cooldown means
# spending the rest of it fighting in whatever you picked up off the floor.
# A one-time kit stays taken: only cooldowns are cleared.
reset-on-death: true

# Keep a copy of every kit in the database as well as in this file. This file
# is still the source of truth, and it already survives a plugin update - it
# lives in the server's plugins folder, not in the jar. The database copy is for
# when this folder goes missing anyway: a host move, a wiped plugins directory.
# On a start that finds no kits here, they are restored from it automatically.
# Delete kits with /kit delete, not by emptying this file, or they come back.
database-backup: true

# --------------------------------------------------------------- pre-potting
#
#  Effects handed out by EVERY kit, on top of whatever the kit lists itself.
#  An arena wants the same potions on every loadout, and repeating them in each
#  kit means four places to edit and four places to get wrong.
#
#  amplifier is ZERO-BASED, the way Minecraft counts it:
#      amplifier: 0  ->  Strength I
#      amplifier: 1  ->  Strength II
#
#  A kit that names the same effect in its own block overrides the one here.
default-effects:
  fire_resistance:
    seconds: 600
    amplifier: 0
  strength:
    seconds: 600
    amplifier: 1
  speed:
    seconds: 600
    amplifier: 1

# ---------------------------------------------------------------- claim area
#
#  Where a kit may be claimed. Off by default; switch it on and kits can only
#  be taken inside the box, which is what stops a player topping up their gear
#  in the middle of the map.
#
#  Set it from where you are standing rather than by hand:
#      /kit setarea [radius]      default radius 32
#      /kit cleararea             claimable anywhere again
#
#  A square, not a circle: the check runs on every claim and a square needs no
#  square root. ffacore.kit.anywhere bypasses it, for staff testing a kit.
claim-area:
  enabled: false
  world: world
  x: 0.5
  z: 0.5
  radius: 32

kits:

  # Six shulkers in one row: the three open kits on the left, the three tiers
  # on the right. Change what is inside any of them in game - /kit, the edit
